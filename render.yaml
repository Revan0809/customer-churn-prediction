services:
  # FastAPI backend — serves /predict and /model-info from the models/
  # artifacts committed in this repo (no retraining happens on deploy).
  - type: web
    name: churn-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

  # Static frontend — plain HTML/CSS/JS, no build step.
  - type: web
    name: churn-frontend
    env: static
    plan: free
    buildCommand: ""
    staticPublishPath: frontend
